[advisories]
yanked = "deny"
# "Unmaintained" notices, not vulnerabilities: these three crates were folded into zbus 6, and
# the Linux keychain crate (zbus-secret-service-keyring-store) still uses zbus 5. Remove these
# lines when that crate moves to zbus 6 (Dependabot will propose it).
ignore = ["RUSTSEC-2026-0370", "RUSTSEC-2026-0371", "RUSTSEC-2026-0372"]

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0",
  "CDLA-Permissive-2.0", # webpki-roots: the CA list data, permissive
]
confidence-threshold = 0.9

[licenses.private]
ignore = true # our own crate (publish = false): proprietary, see LICENSE

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
