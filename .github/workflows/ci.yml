name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to a commit: a tag can be moved, a commit cannot.
# Dependabot proposes updates (see dependabot.yml).
jobs:
  public-repo-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Private planning files must not be tracked
        run: |
          if git ls-files | grep -E '^(PLANNING\.md|cli/)'; then
            echo "::error::PLANNING.md or cli/ is tracked; this repository is public"
            exit 1
          fi

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # Cargo.toml promises Rust 1.89 (File::try_lock): prove it builds there, tests included.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89 --profile minimal --no-self-update
      - run: cargo +1.89 check --locked --all-targets

  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-x64, os: windows-latest }
          - { name: windows-arm64, os: windows-11-arm }
          - { name: macos-x64, os: macos-15-intel }
          - { name: macos-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked -q -- --version
      - name: Release binary stays under 10 MB
        if: matrix.name == 'linux-x64'
        run: |
          cargo build --release --locked
          size=$(stat -c %s target/release/spendbranch)
          echo "release binary: $size bytes"
          test "$size" -lt 10000000
