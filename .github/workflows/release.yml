name: Release

# Push a tag like v0.2.0 (equal to the version in Cargo.toml): the tests run on the 6 systems,
# then the 6 binaries are built (signed when the certificates are set up), and the release is
# published with the archives and their SHA-256 sums.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag must be the version in Cargo.toml
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: build ${{ matrix.name }}
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, exe: '' }
          - { name: linux-arm64, os: ubuntu-24.04-arm, exe: '' }
          - { name: windows-x64, os: windows-latest, exe: .exe }
          - { name: windows-arm64, os: windows-11-arm, exe: .exe }
          - { name: macos-x64, os: macos-15-intel, exe: '' }
          - { name: macos-arm64, os: macos-latest, exe: '' }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BIN: target/release/spendbranch${{ matrix.exe }}
      # Signing runs only where its secrets exist; otherwise the binary ships unsigned, with a warning.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE_PFX != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: Build
        shell: bash
        # The production origin (a repository variable); empty leaves the release without a default.
        env:
          SPENDBRANCH_DEFAULT_SERVER: ${{ vars.SPENDBRANCH_DEFAULT_SERVER }}
        run: |
          cargo build --release --locked
          "$BIN" --version

      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/sign.keychain-db"
          kpass=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kpass" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" --keychain "$keychain" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          ditto -c -k "$BIN" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait

      - name: Sign (Windows)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD $env:BIN
          $code = $LASTEXITCODE
          Remove-Item $pfx
          if ($code) { exit $code }
          & $signtool.FullName verify /pa $env:BIN
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Say when the binary is unsigned
        if: (runner.os == 'macOS' && env.HAS_APPLE_CERT != 'true') || (runner.os == 'Windows' && env.HAS_WINDOWS_CERT != 'true')
        run: echo "::warning::${{ matrix.name }} ships unsigned (no signing certificate in the repository secrets)"

      - name: Package
        shell: bash
        run: |
          name="spendbranch-$VERSION-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp "$BIN" LICENSE README.md "dist/$name/"
          [ -f docs/INSTALL.md ] && cp docs/INSTALL.md "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a hyphen (v0.2.0-rc.1) is published as a pre-release.
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SpendBranch CLI $GITHUB_REF_NAME" \
            --generate-notes --verify-tag $pre
