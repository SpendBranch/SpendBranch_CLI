[package]
name = "spendbranch"
version = "0.1.0"
edition = "2024"
rust-version = "1.89" # File::try_lock (stable in 1.89)
description = "SpendBranch CLI: collects only authorized AI agent session metadata"
publish = false
license-file = "LICENSE"

[[bin]]
name = "spendbranch"
path = "src/main.rs"

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dependencies]
jiff = { version = "0.2.42", default-features = false, features = ["std"] }
lexopt = "0.3.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.29.2", features = ["v4"] }
zstd = "0.14.3"
base64 = "0.22"
zeroize = "1"
ed25519-dalek = "3"
getrandom = "0.4"
keyring-core = "1"
sha2 = "0.11"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }

# The system credential store: one crate per platform, chosen at compile time.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
