[package]
name = "spendbranch"
version = "0.1.0"
edition = "2024"
rust-version = "1.89" # File::try_lock (stable in 1.89)
description = "SpendBranch CLI: collects only authorized AI agent session metadata"
publish = false
license-file = "LICENSE"

[[bin]]
name = "spendbranch"
path = "src/main.rs"

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dependencies]
jiff = { version = "0.2.42", default-features = false, features = ["std"] }
lexopt = "0.3.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.29.2", features = ["v4"] }
zstd = "0.14.3"
