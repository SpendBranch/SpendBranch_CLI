[package]
name = "spendbranch"
version = "0.1.0"
edition = "2024"
rust-version = "1.89" # File::try_lock (stable in 1.89)
description = "SpendBranch CLI: collects only authorized AI agent session metadata"
publish = false
license-file = "LICENSE"

[[bin]]
name = "spendbranch"
path = "src/main.rs"

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }
tempfile = "3.27.0"
# TLS test servers: a throwaway certificate, and rustls with TLS 1.2 so a 1.2-only server exists.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dependencies]
jiff = { version = "0.2.42", default-features = false, features = ["std"] }
lexopt = "0.3.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: the user's settings.json keeps its key order when we edit it.
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1.29.2", features = ["v4"] }
zstd = "0.14.3"
base64 = "0.22"
zeroize = "1"
# Batches go out gzipped (the API wants it). The pure-Rust backend: no C, no unsafe of ours.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ed25519-dalek = "3"
getrandom = "0.4"
keyring-core = "1"
sha2 = "0.11"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
# Direct, only to hand ureq a crypto provider that has TLS 1.3 suites and nothing older.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# The system credential store: one crate per platform, chosen at compile time.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
